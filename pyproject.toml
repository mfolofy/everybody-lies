[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "everybody-lies"
version = "0.2.0"
description = "Code review tools ask nicely. House doesn't. Five specialists. One verdict. Fix it."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "House (Gatekeeper)" },
]
keywords = [
    "code-review",
    "ai",
    "llm",
    "multi-agent",
    "gatekeeper",
    "pre-commit",
    "itil",
    "devops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/mfolofy/everybody-lies"
Repository = "https://github.com/mfolofy/everybody-lies"
Issues = "https://github.com/mfolofy/everybody-lies/issues"

[project.scripts]
everybody-lies = "everybody_lies.cli:main"

[tool.hatch.build]
exclude = ["LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["everybody_lies"]
include = [
    "everybody_lies/**/*.json",
]
